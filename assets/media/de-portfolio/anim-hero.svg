<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Общая схема: landing → Spark → DDS → DM → витрины, с DQ-гейтом">
  <style>
    .bg   { fill: #0b1020; }
    .node { fill: #182245; stroke: #23305a; stroke-width: 1.5; }
    .node-accent { stroke: #2f6f5f; }
    .t    { fill: #e8eefc; font: 600 13px 'Segoe UI', Arial, sans-serif; }
    .s    { fill: #8ea0c9; font: 11px 'Segoe UI', Arial, sans-serif; }
    .wire { fill: none; stroke: #24305a; stroke-width: 7; stroke-linecap: round; }
    .flow { fill: none; stroke: #4dd4ac; stroke-width: 2; stroke-dasharray: 7 15; animation: dash 1.3s linear infinite; }
    .pk   { fill: #4dd4ac; }
    .pk2  { fill: #ffb454; }
    .a1 { animation: run 3.2s linear infinite; }
    .a2 { animation: run 3.2s linear infinite .9s; }
    .a3 { animation: run 3.2s linear infinite 1.8s; }
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    .gate { fill: #141d3a; stroke: #2f6f5f; stroke-width: 1.5; animation: gateGlow 3s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -44; } }
    @keyframes run  { from { transform: translateX(0); } to { transform: translateX(648px); } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: .9; } }
    @keyframes gateGlow { 0%, 100% { stroke: #2f6f5f; } 50% { stroke: #4dd4ac; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .a1, .a2, .a3, .glow, .gate { animation: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="220" rx="16"/>

  <line class="wire" x1="124" y1="104" x2="664" y2="104"/>
  <line class="flow" x1="124" y1="104" x2="664" y2="104"/>

  <circle class="pk a1" cx="40" cy="104" r="5"/>
  <circle class="pk2 a2" cx="40" cy="100" r="4"/>
  <circle class="pk a3" cx="40" cy="108" r="4"/>

  <rect class="node" x="24" y="74" width="100" height="60" rx="12"/>
  <text class="t" x="74" y="100" text-anchor="middle">Landing</text>
  <text class="s" x="74" y="118" text-anchor="middle">CSV · Kafka</text>

  <rect class="node node-accent" x="184" y="74" width="100" height="60" rx="12"/>
  <text class="t" x="234" y="100" text-anchor="middle">Spark</text>
  <text class="s" x="234" y="118" text-anchor="middle">Airflow</text>

  <rect class="node" x="344" y="74" width="100" height="60" rx="12"/>
  <text class="t" x="394" y="100" text-anchor="middle">DDS</text>
  <text class="s" x="394" y="118" text-anchor="middle">3NF · Postgres</text>

  <rect class="node" x="504" y="74" width="100" height="60" rx="12"/>
  <text class="t" x="554" y="100" text-anchor="middle">DM</text>
  <text class="s" x="554" y="118" text-anchor="middle">звезда · SCD2</text>

  <rect class="node" x="664" y="74" width="132" height="60" rx="12"/>
  <text class="t" x="730" y="100" text-anchor="middle">Витрины</text>
  <text class="s" x="730" y="118" text-anchor="middle">ClickHouse · BI</text>

  <rect class="gate" x="24" y="166" width="772" height="34" rx="10"/>
  <text class="s" x="40" y="188">DQ gate · meta.dq_result · Prometheus · Grafana</text>
  <circle class="pk glow" cx="758" cy="183" r="6"/>
</svg>
